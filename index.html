<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0620">
<title>코스모 팡 · COSMO PANG</title>
<meta name="description" content="태양계 행성의 공전이 중력을 바꾸는 우주 블록 매칭 퍼즐">
<link rel="icon" href="assets/earth.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- 플레이 HUD -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="chip"><span class="star">✦</span><b id="hudCredits">0</b></div>
      <div class="scorebox"><small>SCORE</small><b id="hudScore">0</b></div>
      <button class="iconbtn" id="btnQuit" aria-label="그만하기">✕</button>
    </div>
    <div class="bottombar">
      <div class="bars">
        <div class="bar time"><i id="timeFill"></i><span id="timeText">60</span></div>
        <div class="bar fever"><i id="feverFill"></i><span id="feverText">FEVER</span></div>
      </div>
      <button id="btnComet" class="cometbtn"><span class="ic">☄</span><small id="cometCost">무료 1회</small></button>
    </div>
  </div>

  <!-- 홈 -->
  <div id="home" class="screen">
    <div class="hometop">
      <div class="chip big"><span class="star">✦</span><b id="homeCredits">0</b></div>
      <button class="iconbtn" id="btnSound" aria-label="소리">♪</button>
    </div>
    <div class="logo">
      <div class="sub">SOLAR GRAVITY PUZZLE</div>
      <h1>COSMO<span>PANG</span></h1>
      <div class="kr">코스모 팡</div>
    </div>
    <img id="mascotImg" src="assets/mascot.png" alt="루미">
    <div class="stats">
      <div><small>최고 점수</small><b id="homeBest">0</b></div>
      <div><small>최고 스테이지</small><b id="homeCombo">0</b></div>
      <div><small>탐사 레벨</small><b id="homeLevel">1</b></div>
    </div>
    <button class="btn primary" id="btnPlay">게임 시작 <em>✦10</em></button>
    <div class="row">
      <button class="btn" id="btnDaily">출석 보상<i id="dailyDot" class="dot hidden"></i></button>
      <button class="btn" id="btnRank">랭킹</button>
      <button class="btn" id="btnHelp">게임 방법</button>
    </div>
    <button class="btn google" id="btnLogin">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.200 0-9.600-3.300-11.300-7.900l-6.500 5C9.500 39.600 16.200 44 24 44z"/><path fill="#1976D2" d="M43.600 20.100H42V20H24v8h11.300c-.800 2.200-2.200 4.200-4.100 5.600l6.200 5.200C36.900 39.200 44 34 44 24c0-1.300-.100-2.600-.400-3.900z"/></svg>
      <span id="loginLabel">Google 계정으로 로그인</span>
    </button>
    <div class="foot" id="saveNote">게스트 모드 · 이 기기에만 저장됩니다</div>
  </div>

  <!-- 모달 -->
  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="firebase-config.js"></script>
<script src="game.js"></script>
</body>
</html>
